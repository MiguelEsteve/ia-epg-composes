global:
  scrape_interval: 5s  # Create an interval of time between calls

scrape_configs:
  - job_name: 'downloader' #job name, better if it is the same as the server
    static_configs:
      # - targets: ['host.docker.internal:8039' ]  # Use host.docker.internal to call localhost
      - targets: ['downloader:8039' ]  # Use host.docker.internal to call localhost
  - job_name: 'recorder'
    static_configs:
      # - targets: ['host.docker.internal:8060' ]
      - targets: ['recorder:8060' ]
  - job_name: 'controller'
    static_configs:
      # - targets: ['host.docker.internal:5002' ]
      - targets: ['controller:8010' ]
  - job_name: 'assetizer'
    static_configs:
      # - targets: ['host.docker.internal:8050' ]
      - targets: ['assetizer:8050' ]
  - job_name: 'transcript'
    static_configs:
      # - targets: ['host.docker.internal:8028' ]
      - targets: ['transcript:8028' ]
