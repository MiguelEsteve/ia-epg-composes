services:
  assetizer:
    build:
      context: ../ia-vct-assetizer
      dockerfile: Dockerfile
    ports:
      - "${ASSETIZER_PORT}:8050"
    command: gunicorn -w 1 -b 0.0.0.0:8050 --timeout 3600 app:app
    environment:
      ON_CLOUD: 'True'
      TEST_MODE: 'False'
      PROMETHEUS_MULTIPROC_DIR: "/metrics/assetizer"
      ASSETIZER_PORT: "${ASSETIZER_PORT}"
      ASSETIZER_VOLUME: "${ASSETIZER_VOLUME}"
      ASSETIZER_LOGS: "${ASSETIZER_LOGS}"
      FFMPEG_ROOT: "${FFMPEG_ROOT}"
      LOGGING_LEVEL: "${LOGGING_LEVEL}"
      LOGSTASH_PORT: "${LOGSTASH_PORT}"
      EXPOSE_LOGSTASH: "${EXPOSE_LOGSTASH}"
    networks:
      - epg_network
    volumes:
      - "${ASSETIZER_VOLUME}:/etc/configmaps"
      - "${GLOBAL_VOLUME}:/workspace_downloader"
      - "${ASSETIZER_LOGS}:/var/log/assetizer"
      - "${ASSETIZER_METRICS}:/metrics"

networks:
  epg_network:
    driver: bridge